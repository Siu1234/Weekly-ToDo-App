<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF7F2" />
  <title>Weekly To-Do</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div class="app__header-top">
        <h1 class="app__title">Weekly To-Do</h1>
        <button class="memo-btn" id="memo-open" type="button" aria-label="Open memo" title="Pending memo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </button>
      </div>

      <nav class="week-nav" aria-label="Week navigation">
        <button class="week-nav__btn" id="prev-week" aria-label="Previous week">&#8592;</button>
        <div class="week-nav__label">
          <span id="week-range" class="week-nav__range"></span>
          <span id="week-hint" class="week-nav__hint"></span>
        </div>
        <button class="week-nav__btn" id="next-week" aria-label="Next week">&#8594;</button>
      </nav>

      <button class="clear-all" id="clear-all">Clear all this week</button>
    </header>

    <section class="days" id="days" aria-label="Days of the week"></section>

    <footer class="app__footer">
      <p>Your tasks are saved on this device only.</p>
    </footer>
  </main>

  <div class="modal" id="clear-modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="alertdialog" aria-modal="true" aria-labelledby="clear-modal-title">
      <h2 id="clear-modal-title">Clear whole week?</h2>
      <p>All tasks for the week <span id="clear-modal-range"></span> will be deleted. This can't be undone.</p>
      <div class="modal__actions">
        <button class="btn btn--ghost" data-close>Keep tasks</button>
        <button class="btn btn--danger" id="clear-confirm">Clear week</button>
      </div>
    </div>
  </div>

  <div class="memo" id="memo" hidden>
    <div class="memo__backdrop" data-memo-close></div>
    <aside class="memo__panel" role="dialog" aria-modal="true" aria-labelledby="memo-title">
      <div class="memo__head">
        <h2 id="memo-title">Pending memo</h2>
        <button class="memo__close" data-memo-close aria-label="Close memo">&times;</button>
      </div>
      <textarea id="memo-text" class="memo__text" placeholder="Jot down anything you still need to do&#10;— it stays here across weeks."></textarea>
      <div class="memo__foot">
        <span id="memo-count" class="memo__count"></span>
        <button class="memo__clear" id="memo-clear">Clear</button>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
